name: Build all Erlang versions and upload to PackageCloud

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5' # 08:30 mon-fri
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  tester:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:resolute, ubuntu:noble, ubuntu:jammy, debian:bookworm]
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        erlang_version: ['25.3', '29.1.2']
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: tester
          build-args: |
            image=${{ matrix.image }}
            erlang_version=${{ matrix.erlang_version }}
          cache-from: type=gha,scope=tester-${{ matrix.image }}-${{ matrix.runner }}-${{ matrix.erlang_version }}
          cache-to: type=gha,mode=max,scope=tester-${{ matrix.image }}-${{ matrix.runner }}-${{ matrix.erlang_version }}

  missing-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: ruby
      - name: Check missing versions
        id: missing-versions
        run: |
          missing_versions=$(bin/missing-versions)
          echo "matrix=$missing_versions" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
    outputs:
      matrix: ${{ steps.missing-versions.outputs.matrix }}

  build-and-upload:
    needs: missing-versions
    if: ${{ needs.missing-versions.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 10
      matrix:
        include: ${{ fromJson(needs.missing-versions.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: ruby
      - uses: depot/use-action@9bda29f1fc3163c06fc15f375887a341096a5639 # v1.3.1
      - name: Build Erlang version and upload to PackageCloud
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
          UPLOAD: ${{ github.event_name != 'pull_request' }}
        run : bin/build-and-upload ${{ matrix.version }} ${{ matrix.image }} ${{ matrix.platform }}
